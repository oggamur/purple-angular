<app-input iconUrl="icons/form/mail.svg" (controlValue)="onInputChange($event)"></app-input>

<button (click)="onButtonClick()">Click Me!</button>
<hr />
@if (isButtonClicked) {
  <p>Ты нажал на кнопку!</p>
} @else {
  <p>Тебе следует нажать на кнопку!</p>
}

<ul>
  @for (greating of greatings; track greating; let i = $index) {
    <li>{{ greating }}</li>
  }
</ul>
