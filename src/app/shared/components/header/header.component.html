<header class="header">
  <div class="header__content">
    <div class="header__logo">
      <img src="/images/logo.svg" alt="Filmly logo" />
    </div>
    <nav class="header__menu">
      @for (item of menuItems; track item.id) {
        <app-nav-button
          [iconUrlActive]="item.iconUrlActive"
          [iconUrlInActive]="item.iconUrlInActive"
          [text]="item.text"
          [routerLink]="item.link"
          routerLinkActive="active"
        ></app-nav-button>
      }
    </nav>
  </div>
</header>
